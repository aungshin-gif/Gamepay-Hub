<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gamepay Hub — Admin</title>
<style>
  :root{
    --bg1:#160021; --bg2:#2a083f; --bg3:#4c1480;
    --glass:rgba(255,255,255,.08); --border:rgba(224,180,255,.22);
    --neon:#b86bff; --text:#fff; --muted:rgba(255,255,255,.7);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif; color:var(--text);
    background:linear-gradient(135deg,#1a0028 0%,#34104f 30%,#5a1a86 65%,#7a35c7 100%);
    background-attachment:fixed;
  }
  .wrap{ width:min(1100px,94%); margin:0 auto; padding:24px 0 60px; }
  h1{ font-size:22px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:20px; }
  .card{
    background:var(--glass); border:1px solid var(--border); border-radius:16px;
    padding:18px; backdrop-filter:blur(10px);
  }
  input{
    width:100%; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:rgba(0,0,0,.25); color:#fff; font-size:14px; margin-bottom:10px;
  }
  button{
    padding:11px 18px; border-radius:10px; border:none; cursor:pointer;
    background:linear-gradient(135deg,#7a35c7,#b86bff); color:#fff; font-weight:700; font-size:13px;
  }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button.ghost{ background:rgba(255,255,255,.08); border:1px solid var(--border); }
  button.danger{ background:linear-gradient(135deg,#c73535,#ff6b6b); }

  #loginView{ max-width:380px; margin:80px auto 0; }
  #loginView h1{ text-align:center; }
  #loginError{ color:#ff9fc9; font-size:13px; min-height:18px; margin-bottom:6px; }

  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .layout{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media(max-width:820px){ .layout{ grid-template-columns:1fr; } }

  .order-list{ display:flex; flex-direction:column; gap:10px; max-height:78vh; overflow-y:auto; }
  .order-row{
    padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:rgba(255,255,255,.04); cursor:pointer; transition:.15s;
  }
  .order-row:hover{ background:rgba(255,255,255,.09); }
  .order-row.active{ border-color:var(--neon); background:rgba(184,107,255,.14); }
  .order-row .code{ font-weight:800; font-size:13px; }
  .order-row .line{ font-size:12px; color:var(--muted); margin-top:2px; }
  .badge{ display:inline-block; font-size:10px; font-weight:800; padding:3px 8px; border-radius:20px; margin-left:6px; }
  .badge.pending{ background:#5a4a1a; color:#ffe08a; }
  .badge.approved{ background:#1a5a34; color:#8affc1; }
  .badge.rejected{ background:#5a1a2a; color:#ff9fc9; }
  .badge.completed{ background:#1a3a5a; color:#8ad4ff; }
  .order-actions{ display:flex; gap:8px; margin-top:8px; }

  .chat-panel .chat-empty{ text-align:center; color:var(--muted); font-size:13px; padding:30px 0; }
  .chat-messages{
    display:flex; flex-direction:column; gap:8px; max-height:48vh; overflow-y:auto;
    padding:6px; margin-bottom:10px;
  }
  .bubble{ max-width:78%; padding:9px 13px; border-radius:14px; font-size:13px; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
  .bubble.admin{ align-self:flex-end; background:linear-gradient(135deg,#7a35c7,#b86bff); border-bottom-right-radius:4px; }
  .bubble.customer{ align-self:flex-start; background:rgba(255,255,255,.1); border:1px solid var(--border); border-bottom-left-radius:4px; }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ margin-bottom:0; }
  .order-detail{ font-size:12px; color:var(--muted); line-height:1.7; margin-bottom:12px; }
  .order-detail b{ color:#fff; }
  .hidden{ display:none !important; }
  .signout{ font-size:12px; color:var(--muted); background:none; padding:6px 10px; }
</style>
</head>
<body>

<div id="loginView" class="card">
  <h1>GamePay Hub Admin</h1>
  <p class="sub" style="text-align:center">Sign in with your admin account</p>
  <div id="loginError"></div>
  <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" />
  <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
  <button id="loginBtn" style="width:100%">Sign in</button>
</div>

<div id="dashboardView" class="wrap hidden">
  <div class="top-row">
    <div>
      <h1>Order Dashboard</h1>
      <div class="sub">Live — updates automatically, no refresh needed.</div>
    </div>
    <button id="signOutBtn" class="signout">Sign out</button>
  </div>

  <div class="layout">
    <div class="card">
      <div id="orderList" class="order-list"><div class="chat-empty">Loading orders…</div></div>
    </div>

    <div class="card chat-panel">
      <div id="noOrderSelected" class="chat-empty">Select an order to see details and chat.</div>
      <div id="orderDetailBox" class="hidden">
        <div class="order-detail" id="orderDetail"></div>
        <div class="order-actions" id="orderApproveRow"></div>
        <div id="chatMessages" class="chat-messages"></div>
        <form id="chatForm" class="chat-input-row">
          <input id="chatInput" type="text" placeholder="Reply to customer…" autocomplete="off" />
          <button type="submit">Send</button>
        </form>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Must match the same project as index.html's SUPABASE_URL / SUPABASE_ANON_KEY.
const SUPABASE_URL = "PASTE_YOUR_SUPABASE_URL_HERE";
const SUPABASE_ANON_KEY = "PASTE_YOUR_SUPABASE_ANON_KEY_HERE";
const sb = (/^https?:\/\//.test(SUPABASE_URL)) ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

const loginView = document.getElementById("loginView");
const dashboardView = document.getElementById("dashboardView");
const loginError = document.getElementById("loginError");
const orderList = document.getElementById("orderList");
const noOrderSelected = document.getElementById("noOrderSelected");
const orderDetailBox = document.getElementById("orderDetailBox");
const orderDetail = document.getElementById("orderDetail");
const orderApproveRow = document.getElementById("orderApproveRow");
const chatMessages = document.getElementById("chatMessages");

let orders = [];
let selectedOrderId = null;

function fail(msg){ loginError.textContent = msg; }

document.getElementById("loginBtn").addEventListener("click", async () => {
  if(!sb){ fail("Supabase ကို config မလုပ်ရသေးပါ — SUPABASE_URL/KEY ကို ဖြည့်ပါ။"); return; }
  fail("");
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ fail(error.message); return; }
  await checkAdminAndEnter();
});

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

async function checkAdminAndEnter(){
  const { data: isAdmin, error } = await sb.rpc("is_admin");
  if(error || !isAdmin){
    fail("ဒီ account က admin မဟုတ်ပါ။ Supabase's admins table ထဲ user_id ထည့်ပေးထားဖို့လိုပါတယ်။");
    await sb.auth.signOut();
    return;
  }
  loginView.classList.add("hidden");
  dashboardView.classList.remove("hidden");
  loadOrders();
  subscribeRealtime();
}

function statusBadge(status){
  return `<span class="badge ${status}">${status.toUpperCase()}</span>`;
}

function renderOrderList(){
  if(!orders.length){ orderList.innerHTML = "<div class='chat-empty'>No orders yet.</div>"; return; }
  orderList.innerHTML = orders.map(o => `
    <div class="order-row ${o.id === selectedOrderId ? "active" : ""}" data-id="${o.id}">
      <div class="code">${o.order_code} ${statusBadge(o.status)}</div>
      <div class="line">${o.product_name} · ${o.plan_name}</div>
      <div class="line">${Number(o.amount).toLocaleString()} Ks · ${o.payment_method || "-"}</div>
    </div>
  `).join("");
  orderList.querySelectorAll(".order-row").forEach(el => {
    el.addEventListener("click", () => selectOrder(el.dataset.id));
  });
}

async function loadOrders(){
  const { data, error } = await sb.from("orders").select("*").order("created_at", { ascending: false });
  if(!error){ orders = data || []; renderOrderList(); }
}

function subscribeRealtime(){
  sb.channel("admin-orders")
    .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => loadOrders())
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, (payload) => {
      if(payload.new.order_id === selectedOrderId && payload.new.sender === "customer"){
        appendBubble(payload.new.sender, payload.new.body);
      }
    })
    .subscribe();
}

async function selectOrder(id){
  selectedOrderId = id;
  renderOrderList();
  const order = orders.find(o => o.id === id);
  if(!order) return;
  noOrderSelected.classList.add("hidden");
  orderDetailBox.classList.remove("hidden");
  orderDetail.innerHTML = `
    <b>${order.product_name}</b> — ${order.plan_name}<br>
    Amount: <b>${Number(order.amount).toLocaleString()} Ks</b> · Payment: ${order.payment_method || "-"}<br>
    Account/Email: ${order.account_info || "-"}<br>
    Note: ${order.note || "-"}<br>
    Placed: ${new Date(order.created_at).toLocaleString()}
  `;
  orderApproveRow.innerHTML = order.status === "pending"
    ? `<button id="approveBtn">Approve ✅</button><button id="rejectBtn" class="danger">Reject</button>`
    : `${statusBadge(order.status)}`;
  document.getElementById("approveBtn")?.addEventListener("click", () => setStatus(order, "approved"));
  document.getElementById("rejectBtn")?.addEventListener("click", () => setStatus(order, "rejected"));
  loadMessages(order.id);
}

async function setStatus(order, status){
  const { error } = await sb.from("orders").update({ status, updated_at: new Date().toISOString() }).eq("id", order.id);
  if(error){ alert("Update failed: " + error.message); return; }
  order.status = status;
  sb.channel("order-" + order.access_token).send({ type: "broadcast", event: "status_update", payload: { status } });
  selectOrder(order.id);
}

function appendBubble(sender, body){
  const empty = chatMessages.querySelector(".chat-empty");
  if(empty) empty.remove();
  const b = document.createElement("div");
  b.className = "bubble " + (sender === "admin" ? "admin" : "customer");
  b.textContent = body;
  chatMessages.appendChild(b);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function loadMessages(orderId){
  chatMessages.innerHTML = "<div class='chat-empty'>Loading…</div>";
  const { data, error } = await sb.from("messages").select("*").eq("order_id", orderId).order("created_at", { ascending: true });
  chatMessages.innerHTML = "";
  if(!error && data && data.length){
    data.forEach(m => appendBubble(m.sender, m.body));
  } else {
    chatMessages.innerHTML = "<div class='chat-empty'>No messages yet.</div>";
  }
}

document.getElementById("chatForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  const order = orders.find(o => o.id === selectedOrderId);
  if(!text || !order) return;
  input.value = "";
  const { error } = await sb.from("messages").insert({ order_id: order.id, sender: "admin", body: text });
  if(error){ alert("Send failed: " + error.message); return; }
  appendBubble("admin", text);
  sb.channel("order-" + order.access_token).send({ type: "broadcast", event: "new_message", payload: { sender: "admin", body: text } });
});

// Stay signed in across refreshes.
(async () => {
  if(!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if(session) checkAdminAndEnter();
})();
</script>
</body>
</html>
