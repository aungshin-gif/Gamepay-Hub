<!-- Gamepay Hub international UI revision: plans as rounded-square cards; notes are tap-to-view; guide hidden. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
  />
  <title>Gamepay Hub - Digital Products Store</title>

  <style>
:root{
  --bg1:#160021;
  --bg2:#2a083f;
  --bg3:#4c1480;
  --bg4:#7a35c7;
  --bg5:#c78cff;

  --text:#ffffff;
  --muted:rgba(255,255,255,.74);

  --glass:rgba(255,255,255,.10);
  --glass2:rgba(255,255,255,.06);
  --border:rgba(224,180,255,.22);

  --neon:#d58cff;
  --neon2:#b86bff;
  --neon3:#f3b8ff;
  --cyan:#b993ff;

  --good:#c9ffe0;
  --danger:#ff9fc9;

  --shadow:0 18px 44px rgba(18,0,32,.28);
  --radius-xl:28px;
  --radius-lg:22px;
  --radius-md:16px;
  --radius-sm:12px;
}
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      -webkit-tap-highlight-color:transparent;
    }
html,
body{
  width:100%;
  max-width:100%;
  margin:0;
  padding:0;
  overflow-x:hidden;
  overflow-y:auto;
  scroll-behavior:auto;
  background:#12001d;
  -webkit-overflow-scrolling:touch;
}
    
body{
  min-height:100vh;
  font-family:Arial,Helvetica,sans-serif;
  color:var(--text);
  overflow-x:hidden;
  background:
    radial-gradient(circle at 20% 18%, rgba(255,255,255,.18) 0%, transparent 16%),
    radial-gradient(circle at 80% 20%, rgba(220,160,255,.18) 0%, transparent 20%),
    radial-gradient(circle at 50% 78%, rgba(190,140,255,.14) 0%, transparent 24%),
    linear-gradient(135deg,
      #1a0028 0%,
      #34104f 28%,
      #5a1a86 58%,
      #7a35c7 82%,
      #b57cff 100%);
  background-attachment:fixed;
}
    @keyframes bgMove{
      0%{background-position:0% 50%;}
      50%{background-position:100% 50%;}
      100%{background-position:0% 50%;}
    }
#particles{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
  pointer-events:none;
  opacity:.95;
}
   

    .page{
      position:relative;
      z-index:1;
      width:min(1220px,94%);
      margin:0 auto;
      padding:18px 0 50px;

    }

    .hero{
      text-align:center;
      padding:10px 0 18px;
    }

    .brand-wrap{
      display:flex;
      align-items:center;
      justify-content:center;
      gap:14px;
      flex-wrap:wrap;
      margin-bottom:8px;
    }

    .brand-orb{
      width:58px;
      height:58px;
      border-radius:50%;
      background:
        radial-gradient(circle at 30% 30%, #fff8c4 0%, #ffd166 12%, #f3c1ff 28%, #c77dff 48%, #7b2cbf 76%, #2d0847 100%);
      box-shadow:
        0 0 18px rgba(255,255,255,.28),
        0 0 28px rgba(199,125,255,.48),
        0 0 54px rgba(123,44,191,.35);
      animation:orbPulse 2.8s ease-in-out infinite alternate;
      object-fit:cover;
      flex-shrink:0;
      display:flex;
      align-items:center;
      justify-content:center;
    }

    @keyframes orbPulse{
      from{transform:scale(1);}
      to{transform:scale(1.08);}
    }

    .hero-title{
      font-size:clamp(32px,5vw,54px);
      font-weight:900;
      letter-spacing:.5px;
      background:linear-gradient(90deg,#fff3b0 0%,#ffd166 20%,#ffffff 46%,#f1c8ff 66%,#c77dff 100%);
      -webkit-background-clip:text;
      background-clip:text;
      color:transparent;
      text-shadow:
        0 0 12px rgba(255,255,255,.14),
        0 0 24px rgba(199,125,255,.34),
        0 0 52px rgba(157,78,221,.24);
      line-height:1.1;
    }

    .hero-sub{
      margin-top:6px;
      font-size:14px;
      color:var(--muted);
      letter-spacing:.4px;
    }

    .search-wrap{
      width:min(760px,100%);
      margin:18px auto 14px;
      position:relative;
    }
.search-wrap input{
  width:100%;
  border:none;
  outline:none;
  border-radius:20px;
  padding:16px 18px 16px 48px;
  color:#fff;
  font-size:15px;
  background:linear-gradient(180deg, rgba(75,20,120,.88), rgba(45,8,71,.88));
  border:1px solid rgba(199,125,255,.20);
  box-shadow:
    0 10px 24px rgba(0,0,0,.22),
    inset 0 1px 0 rgba(255,255,255,.05);
  backdrop-filter:blur(10px);
  -webkit-backdrop-filter:blur(10px);
  transition:.3s ease;
}
    
.search-wrap input:focus{
  border-color:rgba(255,120,255,.42);
  box-shadow:
    0 0 0 1px rgba(255,120,255,.16),
    0 0 18px rgba(199,125,255,.18),
    0 10px 24px rgba(0,0,0,.22);
}
    

    .search-wrap input::placeholder{
      color:rgba(255,255,255,.56);
    }

    .search-icon{
      position:absolute;
      left:16px;
      top:50%;
      transform:translateY(-50%);
      pointer-events:none;
      opacity:.82;
      font-size:18px;
    }

    .categories{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      justify-content:center;
      margin-bottom:22px;
      padding:0 6px;
      gap:12px;
    }
.cat{
  padding:10px 16px;
  border-radius:999px;
  background:
    linear-gradient(180deg, rgba(255,255,255,.10), rgba(255,255,255,.03)),
    rgba(76,20,128,.28);
  border:1px solid rgba(224,180,255,.18);
  cursor:pointer;
  user-select:none;
  font-size:13px;
  transition:.22s ease;
  box-shadow:
    0 0 10px rgba(199,125,255,.06),
    inset 0 1px 0 rgba(255,255,255,.06);
  color:rgba(255,255,255,.88);
}

.cat:hover,
.cat.active{
  transform:translateY(-2px);
  background:
    linear-gradient(180deg, rgba(255,255,255,.14), rgba(255,255,255,.04)),
    linear-gradient(180deg, rgba(154,82,235,.42), rgba(88,25,150,.34));
  border-color:rgba(245,195,255,.34);
  box-shadow:
    0 0 18px rgba(213,140,255,.16),
    inset 0 1px 0 rgba(255,255,255,.08);
}


    .hidden{
      display:none !important;
    }

    .payment-modal{
  position:fixed;
  inset:0;

  z-index:9999;

  display:flex;
  align-items:center;
  justify-content:center;

  background:rgba(10,0,20,.72);

  backdrop-filter:blur(16px);
}

.payment-card{
  position:relative;

  width:min(92%,400px);

  padding:24px;

  border-radius:28px;

  background:
    linear-gradient(
      180deg,
      rgba(255,255,255,.10),
      rgba(255,255,255,.04)
    );

  border:1px solid rgba(255,255,255,.10);

  box-shadow:
    0 0 40px rgba(199,125,255,.25);
}

.payment-title{
  text-align:center;

  font-size:24px;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 0 18px rgba(199,125,255,.65);
}

.payment-sub{
  margin-top:8px;

  text-align:center;

  color:rgba(255,255,255,.65);
}

#paymentNumber{
  margin-top:24px;

  padding:18px;

  border-radius:20px;

  background:rgba(255,255,255,.06);

  text-align:center;
}

.pay-method{
  font-size:18px;
  font-weight:900;

  color:#ffd6ff;
}

.pay-name{
  margin-top:12px;

  color:#f3ddff;

  font-weight:700;
}

.pay-phone{
  margin-top:14px;

  font-size:22px;
  font-weight:900;

  color:#fff;

  text-shadow:
    0 0 16px rgba(199,125,255,.55);
}

.payment-copy-wrap{
  margin-top:18px;
}

#copyPayBtn{
  width:100%;

  border:none;

  padding:16px;

  border-radius:18px;

  color:#fff;

  font-weight:900;

  background:
    linear-gradient(
      135deg,
      #c77dff,
      #7b2fff
    );
}

.close-modal{
  position:absolute;

  right:28px;

  border:none;
  background:none;

  color:#fff;

  font-size:22px;
}
    .catalog-view{
      width:100%;
    }

    .products{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
      gap:20px;
      justify-items:center;
      align-items:start;
    }
.top-product-badge{
  position:absolute;
  top:10px;
  right:10px;
  z-index:3;
  padding:6px 10px;
  font-size:11px;
  font-weight:800;
  border-radius:999px;
  color:#fff;
  letter-spacing:.3px;
  background:linear-gradient(135deg,#ffb347,#ff6b6b);
  border:1px solid rgba(255,255,255,.18);
  box-shadow:
    0 6px 16px rgba(255,107,107,.25),
    0 0 12px rgba(255,179,71,.22);
  backdrop-filter:blur(6px);
  -webkit-backdrop-filter:blur(6px);
}
.card{
  width:100%;
  max-width:220px;
  position:relative;
  border-radius:22px;
  padding:18px 14px 16px;
  cursor:pointer;

  background:
    linear-gradient(180deg, rgba(255,255,255,.06), rgba(255,255,255,.02)),
    linear-gradient(180deg, rgba(70,18,110,.72), rgba(30,6,50,.88));

  border:1px solid rgba(200,140,255,.16);

  box-shadow:
    0 12px 28px rgba(15,0,25,.28),
    0 0 12px rgba(199,125,255,.06),
    inset 0 1px 0 rgba(255,255,255,.04);

  transition:transform .28s ease, box-shadow .28s ease, border-color .28s ease;
  overflow:hidden;
  min-height:230px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
  animation:none;
  gap:10px;
}
.card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at top left, rgba(255,255,255,.08), transparent 32%),
    linear-gradient(135deg, rgba(255,255,255,.02), transparent 50%, rgba(213,140,255,.05));
  pointer-events:none;
}

.card:hover{
  transform:translateY(-5px) scale(1.01);
  border-color:rgba(220,160,255,.28);

  box-shadow:
    0 14px 32px rgba(15,0,25,.34),
    0 0 18px rgba(199,125,255,.10),
    inset 0 1px 0 rgba(255,255,255,.06);
}
    
    @keyframes cardFloat{
  0%{ transform:translateY(0); }
  50%{ transform:translateY(-4px); }
  100%{ transform:translateY(0); }
    }

.icon-wrap{
  width:78px;
  height:78px;
  border-radius:20px;
  margin:0 auto 12px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:8px;
  background:rgba(255,255,255,.08);
  border:1px solid rgba(199,125,255,.14);
  box-shadow:0 0 18px rgba(199,125,255,.18);
  overflow:hidden;
  font-size:34px;
}
.card img{
  width:100%;
  height:100%;
  border-radius:16px;
  object-fit:cover;
  transition:transform .28s ease, filter .28s ease;
}


   .card:hover{
  transform:translateY(-6px) scale(1.01);
  border-color:rgba(199,125,255,.42);
  box-shadow:
    0 10px 30px rgba(0,0,0,.35),
    0 0 18px rgba(199,125,255,.18);
   } 
.card:active{
  transform:scale(.97);
}
    .card-name{
      font-size:16px;
      font-weight:800;
      line-height:1.25;
      text-align:center;
    }

    .card-sub{
      font-size:12px;
      color:var(--muted);
      margin-top:6px;
      text-align:center;
    }

    .card-bottom{
      margin-top:14px;
      text-align:center;
    }

    .badge{
      display:inline-flex;
      align-items:center;
      gap:6px;
      padding:7px 12px;
      border-radius:999px;
      font-size:12px;
      background:rgba(166,255,203,.10);
      border:1px solid rgba(166,255,203,.20);
      color:#effff5;
      box-shadow:0 0 12px rgba(166,255,203,.08);
    }

   .price-from{
  margin-top:10px;
  font-size:13px;
  font-weight:800;
  color:#fff;
   } 
   .order-view{
  width:min(760px,100%);
  margin:0 auto;
  animation:fadeInUp .3s ease;
}

@keyframes fadeInUp{
  from{
    opacity:0;
    transform:translateY(12px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
} 

.panel{
  background:rgba(28,0,43,.86);
  border:1px solid rgba(255,255,255,.10);
  border-radius:26px;
  padding:18px;
  box-shadow:var(--shadow), 0 0 30px rgba(199,125,255,.12);
  text-align:left;

    }

    .top-actions{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:12px;
      margin-bottom:10px;
    }

    .back-btn{
      border:none;
      border-radius:14px;
      padding:10px 14px;
      color:#fff;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      cursor:pointer;
      font-weight:700;
    }

    .panel-title{
      text-align:center;
      font-size:22px;
      font-weight:900;
      margin-bottom:6px;
    }

    .panel-sub{
      text-align:center;
      font-size:12px;
      color:var(--muted);
      margin-bottom:14px;
    }

    .field{
      margin-top:16px;
    }

    .field-title{
      font-size:13px;
      font-weight:800;
      margin-bottom:10px;
    }

    .input,
    .note-box{
      width:100%;
      border:none;
      outline:none;
      border-radius:16px;
      padding:13px 14px;
      color:#fff;
      font-size:14px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.14);
      box-shadow:
        0 0 18px rgba(199,125,255,.12),
        inset 0 0 10px rgba(255,255,255,.06);
      transition:.22s ease;
    }

    .input:focus,
    .note-box:focus{
      border-color:rgba(199,125,255,.42);
      box-shadow:
        0 0 22px rgba(199,125,255,.20),
        0 0 44px rgba(157,78,221,.10),
        inset 0 0 10px rgba(255,255,255,.08);
    }

    .input::placeholder,
    .note-box::placeholder{
      color:rgba(255,255,255,.52);
    }

    .note-box{
      min-height:96px;
      resize:none;
      line-height:1.55;
    }

    .desc-box{
      min-height:96px;
      resize:none;
      line-height:1.55;
    }

    .cart-item{
      margin-top:14px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      border-radius:18px;
      padding:12px;
    }

    .cart-head{
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:flex-start;
    }

    .cart-name{
      font-size:16px;
      font-weight:800;
      line-height:1.25;
    }

    .cart-plan-current{
      margin-top:4px;
      font-size:12px;
      color:var(--muted);
      line-height:1.4;
    }

    .remove-btn{
      flex-shrink:0;
      border:none;
      border-radius:10px;
      padding:6px 10px;
      font-size:12px;
      color:#fff;
      background:rgba(255,159,201,.14);
      border:1px solid rgba(255,159,201,.24);
      cursor:pointer;
    }

    .plan-toggle{
      width:100%;
      margin-top:10px;
      border:none;
      border-radius:12px;
      padding:10px;
      background:rgba(255,255,255,.06);
      color:#fff;
      border:1px solid rgba(255,255,255,.10);
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }
.plan-list{
  display:grid;
  gap:8px;
  margin-top:10px;
}

.plan-option{
  position: relative;
  padding: 14px 12px;
  border-radius: 12px;

  border: 1px solid rgba(255,255,255,.10);
  background: rgba(255,255,255,.05);

  cursor: pointer;

  font-size: 14.5px;     /* 🔥 bigger */
  font-weight: 700;      /* 🔥 bold */
  line-height: 1.5;

  color: rgba(255,255,255,0.95);  /* 🔥 brighter white */

  text-shadow:
    0 0 6px rgba(255,255,255,.3),
    0 0 12px rgba(199,125,255,.25); /* 🔥 neon glow */

  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);

  transition: .2s ease;
  overflow: visible;
}
.plan-sub-label{
  font-size:12px;
  font-weight:800;
  color:#ffe66d;
  margin-top:5px;
  text-align:center;
  white-space:pre-line;

  text-shadow:
    0 0 6px rgba(255,230,109,.75),
    0 0 14px rgba(255,210,60,.55),
    0 0 24px rgba(255,180,0,.35);
}
 .plan-option div {
  white-space: pre-line !important;
  word-break: break-word !important;
  overflow-wrap: anywhere !important;
 }   

.plan-option.active{
  background: linear-gradient(
    180deg,
    rgba(199,125,255,.18),
    rgba(255,255,255,.05)
  );

  border-color: rgba(220,160,255,.55);

  box-shadow:
    0 0 16px rgba(199,125,255,.25),
    0 0 30px rgba(199,125,255,.18);

  outline: 2px solid rgba(199,125,255,.6);

  color: #ffffff;

  text-shadow:
    0 0 10px rgba(255,255,255,.6),
    0 0 20px rgba(199,125,255,.6); /* 🔥 strong glow */
}



.plan-option.best-seller{
  border-color: rgba(255, 196, 87, .38);
  box-shadow:
    0 0 18px rgba(255, 196, 87, .10),
    inset 0 0 0 1px rgba(255,255,255,.03);
}

.best-seller-badge{
  position: absolute;
  top: -10px;
  right: 10px;
  z-index: 2;
  display: inline-flex;
  align-items: center;
  gap: 5px;
  padding: 5px 10px;

}

.plan-option.active.best-seller{

  box-shadow:
    0 0 18px rgba(199,125,255,.18),

} 
.discount-badge{

  left: 10px;

  display: inline-flex;

.plan-option.discount{

    .out-stock-badge{

.plan-option.out-stock{

      margin-top:12px;

      justify-content:space-between;

      gap:10px;
      flex-wrap:wrap;
    }

    .qty-box{

    }

    .qty-btn{

    .pay-option{
      border-radius:14px;
      padding:12px 10px;
      text-align:center;
      cursor:pointer;
      font-size:13px;
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.12);
      transition:.22s ease;
      user-select:none;
    }

    .pay-option.active{
      background:rgba(199,125,255,.17);
      border-color:rgba(199,125,255,.45);
      box-shadow:0 0 18px rgba(199,125,255,.22);
    }

    .telegram-btn{
      position:relative;
      width:100%;
      margin-top:18px;
      border:none;
      border-radius:18px;
      padding:15px 16px;
      color:#fff;
      font-size:16px;
      font-weight:800;
      cursor:pointer;
      overflow:hidden;
      background:linear-gradient(90deg,#7b2cff,#c24dff,#7b2cff);
      background-size:200% 100%;
      animation:btnFlow 3s linear infinite;
      box-shadow:
        0 0 18px rgba(199,125,255,.34),
        0 0 40px rgba(157,78,221,.18);
    }

    .telegram-btn::before{
      content:"";
      position:absolute;
      inset:-45%;
      background:linear-gradient(120deg, transparent, rgba(255,255,255,.28), transparent);
      transform:rotate(25deg);
      animation:btnGlow 3.2s linear infinite;
      pointer-events:none;
    }

    .telegram-btn:disabled{
      opacity:.6;
      cursor:not-allowed;
      box-shadow:none;
      animation:none;
    }
    .telegram-btn:active{
  transform:scale(.97);
    }

    @keyframes btnFlow{
      0%{background-position:0% 50%;}
      100%{background-position:200% 50%;}
    }

    @keyframes btnGlow{
      0%{transform:rotate(25deg) translateX(-100%);}
      100%{transform:rotate(25deg) translateX(100%);}
    }
  </style>
</head>

<body>
  <div id="particles"></div>

  <div class="page">
    <div class="hero">
      <div class="brand-wrap">
        <div class="brand-orb"></div>
        <h1 class="hero-title">Gamepay Hub</h1>
      </div>
      <p class="hero-sub">Fast & Secure Digital Store 🎮</p>
    </div>

    <div class="search-wrap">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" placeholder="Search products..." />
    </div>

    <div class="categories">
      <button class="cat active" data-cat="all">All</button>
      <button class="cat" data-cat="gamepass">Xbox Game Pass</button>
      <button class="cat" data-cat="netflix">Netflix</button>
      <button class="cat" data-cat="spotify">Spotify</button>
      <button class="cat" data-cat="vpn">VPN</button>
      <button class="cat" data-cat="gift">Gift Cards</button>
    </div>

    <div class="catalog-view" id="catalogView">
      <div class="products" id="productsList"></div>
    </div>

    <div class="order-view hidden" id="orderView">
      <div class="panel">
        <div class="top-actions">
          <button class="back-btn" id="backBtn">← Back</button>
          <span></span>
        </div>
        <h2 class="panel-title">Order Details</h2>
        <p class="panel-sub">Complete your purchase</p>

        <div id="cartItems"></div>

        <div class="summary">
          <div class="line">
            <span>Subtotal:</span>
            <span id="subtotal">0</span>
          </div>
          <div class="line">
            <span>Tax (10%):</span>
            <span id="taxAmount">0</span>
          </div>
          <div class="line-total">
            <span>Total:</span>
            <span id="totalAmount">0</span>
          </div>
        </div>

        <div class="field">
          <label class="field-title">Payment Method</label>
          <div class="pay-grid">
            <button class="pay-option active" data-method="bank">🏦 Bank</button>
            <button class="pay-option" data-method="crypto">₿ Crypto</button>
            <button class="pay-option" data-method="paypal">🅿️ PayPal</button>
            <button class="pay-option" data-method="stripe">💳 Stripe</button>
          </div>
        </div>

        <div class="field">
          <label class="field-title">Your Details</label>
          <input class="input" type="text" id="customerName" placeholder="Full Name" />
          <input class="input" type="email" id="customerEmail" placeholder="Email" />
          <input class="input" type="tel" id="customerPhone" placeholder="Phone" />
        </div>

        <div class="field">
          <label class="field-title">Special Notes (Optional)</label>
          <textarea class="note-box" id="specialNotes" placeholder="Add any special request or note..."></textarea>
        </div>

        <button class="telegram-btn" id="checkoutBtn">
          Proceed to Payment
        </button>
      </div>
    </div>
  </div>

  <div id="paymentModal" class="payment-modal hidden">
    <div class="payment-card">
      <button class="close-modal" id="closePaymentModal">✕</button>
      <h2 class="payment-title">Payment Details</h2>
      <p class="payment-sub">Send payment to:</p>

      <div id="paymentNumber">
        <div class="pay-method" id="payMethod">Bank Transfer</div>
        <div class="pay-name" id="payName">Gamepay Hub</div>
        <div class="pay-phone" id="payPhone">123 456 789</div>
      </div>

      <div class="payment-copy-wrap">
        <button id="copyPayBtn">📋 Copy Payment Details</button>
      </div>
    </div>
  </div>

  <script>
    const productsList = [
      {
        id: 1,
        name: "Xbox Game Pass",
        category: "gamepass",
        sub: "1 Month",
        plans: ["1 Month: $9.99", "3 Months: $24.99", "12 Months: $99.99"],
        price: "$9.99",
        badge: "Popular",
        icon: "🎮",
      },
      {
        id: 2,
        name: "Netflix Premium",
        category: "netflix",
        sub: "4K UHD",
        plans: ["1 Month: $19.99", "3 Months: $54.99", "12 Months: $199.99"],
        price: "$19.99",
        badge: "Top",
        icon: "🎬",
      },
      {
        id: 3,
        name: "Spotify Premium",
        category: "spotify",
        sub: "Unlimited Music",
        plans: ["1 Month: $12.99", "3 Months: $36.99", "12 Months: $129.99"],
        price: "$12.99",
        icon: "🎵",
      },
      {
        id: 4,
        name: "VPN Plus",
        category: "vpn",
        sub: "Ultra Fast",
        plans: ["1 Month: $4.99", "1 Year: $49.99", "Lifetime: $99.99"],
        price: "$4.99",
        icon: "🔐",
      },
      {
        id: 5,
        name: "Amazon Gift Card",
        category: "gift",
        sub: "Digital Code",
        plans: ["$25", "$50", "$100", "$250"],
        price: "$25",
        icon: "🎁",
      },
      {
        id: 6,
        name: "PlayStation Plus",
        category: "gamepass",
        sub: "Extra Tier",
        plans: ["1 Month: $11.99", "3 Months: $33.99", "12 Months: $119.99"],
        price: "$11.99",
        badge: "Hot",
        icon: "🎮",
      },
    ];

    let cart = [];

    function renderProducts(products = productsList) {
      const productsList_el = document.getElementById("productsList");
      productsList_el.innerHTML = products
        .map(
          (p) => `
        <div class="card" onclick="addToCart(${p.id})">
          ${p.badge ? `<div class="top-product-badge">${p.badge}</div>` : ""}
          <div class="icon-wrap">${p.icon}</div>
          <h3 class="card-name">${p.name}</h3>
          <p class="card-sub">${p.sub}</p>
          <div class="card-bottom">
            <span class="badge">✓ Verified</span>
            <p class="price-from">From ${p.price}</p>
          </div>
        </div>
      `
        )
        .join("");
    }

    function addToCart(productId) {
      const product = productsList.find((p) => p.id === productId);
      cart.push({ ...product, quantity: 1 });
      showOrderView();
    }

    function showOrderView() {
      document.getElementById("catalogView").classList.add("hidden");
      document.getElementById("orderView").classList.remove("hidden");
      renderCart();
    }

    function renderCart() {
      const cartItems_el = document.getElementById("cartItems");
      cartItems_el.innerHTML = cart
        .map(
          (item, idx) => `
        <div class="cart-item">
          <div class="cart-head">
            <div>
              <div class="cart-name">${item.name}</div>
              <div class="cart-plan-current" id="plan-${idx}">Plan: ${item.plans[0]}</div>
            </div>
            <button class="remove-btn" onclick="removeFromCart(${idx})">Remove</button>
          </div>
          <button class="plan-toggle" onclick="togglePlans(${idx})">Choose Plan ▼</button>
          <div class="plan-list hidden" id="plan-list-${idx}">
            ${item.plans
              .map(
                (plan, p_idx) => `
              <div class="plan-option ${p_idx === 0 ? "active" : ""}" onclick="selectPlan(${idx}, ${p_idx}, '${plan}')">
                <div>${plan}</div>
              </div>
            `
              )
              .join("")}
          </div>
        </div>
      `
        )
        .join("");

      updateTotal();
    }

    function removeFromCart(idx) {
      cart.splice(idx, 1);
      if (cart.length === 0) {
        document.getElementById("orderView").classList.add("hidden");
        document.getElementById("catalogView").classList.remove("hidden");
      } else {
        renderCart();
      }
    }

    function togglePlans(idx) {
      const planList = document.getElementById(`plan-list-${idx}`);
      planList.classList.toggle("hidden");
    }

    function selectPlan(idx, p_idx, plan) {
      document.getElementById(`plan-${idx}`).innerText = `Plan: ${plan}`;
      const planList = document.getElementById(`plan-list-${idx}`);
      planList.querySelectorAll(".plan-option").forEach((p, i) => {
        p.classList.toggle("active", i === p_idx);
      });
    }

    function updateTotal() {
      const subtotal = cart.length * 15; // Dummy calculation
      const tax = subtotal * 0.1;
      const total = subtotal + tax;

      document.getElementById("subtotal").innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById("taxAmount").innerText = `$${tax.toFixed(2)}`;
      document.getElementById("totalAmount").innerText = `$${total.toFixed(2)}`;
    }

    document.getElementById("backBtn").addEventListener("click", () => {
      document.getElementById("orderView").classList.add("hidden");
      document.getElementById("catalogView").classList.remove("hidden");
    });

    document.querySelectorAll(".cat").forEach((cat) => {
      cat.addEventListener("click", (e) => {
        document.querySelectorAll(".cat").forEach((c) => c.classList.remove("active"));
        e.target.classList.add("active");
        const category = e.target.dataset.cat;
        const filtered =
          category === "all"
            ? productsList
            : productsList.filter((p) => p.category === category);
        renderProducts(filtered);
      });
    });

    document.getElementById("checkoutBtn").addEventListener("click", () => {
      const modal = document.getElementById("paymentModal");
      modal.classList.remove("hidden");
    });

    document.getElementById("closePaymentModal").addEventListener("click", () => {
      document.getElementById("paymentModal").classList.add("hidden");
    });

    document.getElementById("copyPayBtn").addEventListener("click", () => {
      const payMethod = document.getElementById("payMethod").innerText;
      const payName = document.getElementById("payName").innerText;
      const payPhone = document.getElementById("payPhone").innerText;
      const text = `${payMethod}\n${payName}\n${payPhone}`;
      navigator.clipboard.writeText(text).then(() => {
        alert("Payment details copied!");
      });
    });

    renderProducts();
  </script>
</body>
</html>
