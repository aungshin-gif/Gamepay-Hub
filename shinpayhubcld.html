<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Gamepay Hub — Admin</title>
<style>
  :root{
    --bg:#f4f5fa; --card:#ffffff; --border:#e5e7f0; --border-strong:#d7dbe8;
    --ink:#1f2333; --muted:#6b7280; --muted-2:#9099ad;
    --accent:#7c3aed; --accent-hover:#6d28d9; --accent-soft:#f2ecff;
    --good:#16a34a; --good-soft:#dcfce7;
    --warn:#d97706; --warn-soft:#fef3c7;
    --bad:#dc2626; --bad-soft:#fee2e2;
    --info:#2563eb; --info-soft:#dbeafe;
    --shadow:0 1px 2px rgba(20,20,43,.04), 0 8px 24px rgba(20,20,43,.06);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
    color:var(--ink); background:var(--bg);
  }
  .icon{ width:16px; height:16px; vertical-align:-3px; }
  .icon-lg{ width:22px; height:22px; }
  .wrap{ width:min(1160px,94%); margin:0 auto; padding:28px 0 60px; }
  h1{ font-size:20px; margin:0 0 2px; font-weight:800; }
  .sub{ color:var(--muted); font-size:13px; margin-bottom:22px; }
  .card{
    background:var(--card); border:1px solid var(--border); border-radius:16px;
    padding:18px; box-shadow:var(--shadow);
  }
  input{
    width:100%; padding:11px 13px; border-radius:10px; border:1px solid var(--border-strong);
    background:#fff; color:var(--ink); font-size:14px; margin-bottom:10px;
  }
  input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  button{
    display:inline-flex; align-items:center; justify-content:center; gap:6px;
    padding:10px 16px; border-radius:10px; border:none; cursor:pointer;
    background:var(--accent); color:#fff; font-weight:700; font-size:13px;
    transition:background .15s;
  }
  button:hover{ background:var(--accent-hover); }
  button:disabled{ opacity:.5; cursor:not-allowed; }
  button.ghost{ background:#fff; color:var(--ink); border:1px solid var(--border-strong); }
  button.ghost:hover{ background:#f8f8fc; }
  button.danger{ background:#fff; color:var(--bad); border:1px solid #f3c6c6; }
  button.danger:hover{ background:var(--bad-soft); }

  #loginView{ max-width:380px; margin:90px auto 0; text-align:center; }
  #loginView h1{ text-align:center; }
  #loginError{ color:var(--bad); font-size:13px; min-height:18px; margin-bottom:6px; }
  .login-icon{ width:44px; height:44px; margin:0 auto 12px; color:var(--accent); }

  .top-row{ display:flex; align-items:center; justify-content:space-between; margin-bottom:18px; }
  .layout{ display:grid; grid-template-columns:1fr 1.1fr; gap:16px; align-items:start; }
  @media(max-width:820px){ .layout{ grid-template-columns:1fr; } }

  .card-title{ display:flex; align-items:center; gap:8px; font-weight:800; font-size:14px; margin-bottom:12px; color:var(--ink); }
  .card-title .icon{ color:var(--accent); }

  .order-list{ display:flex; flex-direction:column; gap:8px; max-height:76vh; overflow-y:auto; }
  .empty-note{ text-align:center; color:var(--muted); font-size:13px; padding:34px 10px; }
  .order-row{
    padding:12px 14px; border-radius:12px; border:1px solid var(--border);
    background:#fbfbfe; cursor:pointer; transition:.15s;
  }
  .order-row:hover{ background:var(--accent-soft); border-color:#e4d6ff; }
  .order-row.active{ border-color:var(--accent); background:var(--accent-soft); }
  .order-row .code{ font-weight:800; font-size:13px; }
  .order-row .line{ font-size:12px; color:var(--muted); margin-top:2px; }
  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:10px; font-weight:800; padding:3px 9px; border-radius:20px; margin-left:6px; }
  .badge.pending{ background:var(--warn-soft); color:var(--warn); }
  .badge.approved{ background:var(--good-soft); color:var(--good); }
  .badge.rejected{ background:var(--bad-soft); color:var(--bad); }
  .badge.completed{ background:var(--info-soft); color:var(--info); }
  .badge.archived{ background:#eceef4; color:var(--muted); }
  .order-actions{ display:flex; gap:8px; margin-top:8px; }

  .chat-panel .empty-note{ padding:60px 10px; }
  .chat-messages{
    display:flex; flex-direction:column; gap:8px; max-height:42vh; overflow-y:auto;
    padding:4px 2px; margin-bottom:10px;
  }
  .bubble{ max-width:78%; padding:9px 13px; border-radius:14px; font-size:13px; line-height:1.4; white-space:pre-wrap; word-break:break-word; }
  .bubble.admin{ align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .bubble.customer{ align-self:flex-start; background:#f1f2f8; color:var(--ink); border-bottom-left-radius:4px; }
  .chat-input-row{ display:flex; gap:8px; }
  .chat-input-row input{ margin-bottom:0; }
  .order-detail-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:14px; }
  .order-detail-table th{ text-align:left; color:var(--muted); font-weight:600; padding:6px 10px 6px 0; width:38%; vertical-align:top; white-space:nowrap; }
  .order-detail-table td{ color:var(--ink); padding:6px 0; border-bottom:1px solid var(--border); }
  .order-detail-table tr:last-child td{ border-bottom:none; }
  .order-detail-table a{ color:var(--accent); font-weight:700; text-decoration:none; }
  .order-detail-table a:hover{ text-decoration:underline; }
  .hidden{ display:none !important; }
  .signout{ background:#fff; color:var(--muted); border:1px solid var(--border-strong); }
  .signout:hover{ background:#f8f8fc; color:var(--ink); }

  .order-date-header{
    font-size:10.5px; font-weight:800; letter-spacing:.06em; text-transform:uppercase;
    color:var(--muted-2); margin:14px 2px 6px; padding-top:6px; border-top:1px solid var(--border);
  }
  .order-date-header:first-child{ margin-top:0; padding-top:0; border-top:none; }

  .chat-customer-header{
    display:flex; align-items:center; gap:7px; font-size:12px; color:var(--muted);
    background:var(--accent-soft); border-radius:9px; padding:8px 11px; margin-bottom:10px;
  }
  .chat-customer-header b{ color:var(--ink); }
  .chat-customer-header .icon{ color:var(--accent); }

  .right-col{ display:flex; flex-direction:column; }
  .right-col-inner{ display:flex; flex-direction:column; gap:16px; }
  .chat-order-strip{
    display:flex; align-items:center; gap:9px; flex-wrap:wrap; font-size:12px; color:var(--muted);
    background:#fbfbfe; border:1px solid var(--border); border-radius:9px; padding:8px 11px; margin-bottom:8px;
  }
  .chat-order-strip b{ color:var(--ink); }

  .pw-wrap{ position:relative; }
  .pw-wrap input{ padding-right:40px; }
  .pw-toggle{
    position:absolute; right:6px; top:50%; transform:translateY(-50%);
    width:28px; height:28px; padding:0; border:none; background:transparent;
    display:flex; align-items:center; justify-content:center; color:var(--muted); cursor:pointer;
  }
  .pw-toggle:hover{ background:#f0f0f6; border-radius:8px; }

  .user-search-row{
    display:flex; justify-content:space-between; align-items:center; gap:10px;
    padding:9px 11px; border-radius:9px; border:1px solid var(--border); background:#fbfbfe;
    font-size:12.5px; margin-top:6px; cursor:pointer; transition:background .15s, border-color .15s;
  }
  .user-search-row:hover{ background:var(--accent-soft); border-color:var(--accent); }
  .user-search-row .line{ color:var(--muted); font-size:11px; }

  .modal-backdrop{
    position:fixed; inset:0; background:rgba(20,20,43,.45); z-index:300;
    display:flex; align-items:flex-start; justify-content:center;
    padding:40px 16px; overflow-y:auto;
  }
  .modal-backdrop.hidden{ display:none; }
  .modal-card{
    width:min(480px,100%); background:#fff; border-radius:16px; padding:22px;
    box-shadow:0 20px 50px rgba(0,0,0,.25);
  }
  .modal-close{ float:right; cursor:pointer; font-size:20px; color:var(--muted); line-height:1; }
  .user-orders-list{ max-height:340px; overflow-y:auto; margin-top:8px; }
</style>
</head>
<body>

<div id="loginView" class="card">
  <svg class="login-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
  <h1>GamePay Hub Admin</h1>
  <p class="sub">Sign in with your admin account</p>
  <div id="loginError"></div>
  <input id="loginEmail" type="email" placeholder="Email" autocomplete="username" />
  <div class="pw-wrap">
    <input id="loginPassword" type="password" placeholder="Password" autocomplete="current-password" />
    <button type="button" class="pw-toggle" id="loginPwToggle" aria-label="Show password"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg></button>
  </div>
  <button id="loginBtn" style="width:100%">Sign in</button>
</div>

<div id="dashboardView" class="wrap hidden">
  <div class="top-row">
    <div>
      <h1>Order Dashboard</h1>
      <div class="sub">Live — updates automatically, no refresh needed.</div>
    </div>
    <button id="signOutBtn" class="signout"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>Sign out</button>
  </div>

  <div class="card" style="margin-bottom:16px;">
    <div class="card-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>Search Registered Users</div>
    <input id="userSearchInput" type="text" placeholder="Type a username or email…" autocomplete="off" style="margin-bottom:0;" />
    <div id="userSearchResults"></div>
  </div>

  <div class="layout">
    <div class="card">
      <div class="card-title" style="justify-content:space-between;">
        <span style="display:flex;align-items:center;gap:8px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"/><polyline points="3.29 7 12 12 20.71 7"/><line x1="12" y1="22" x2="12" y2="12"/></svg>Orders</span>
        <button id="toggleArchivedBtn" class="ghost" style="padding:6px 12px;font-size:12px;">Show archived</button>
      </div>
      <div id="orderList" class="order-list"><div class="empty-note">Loading orders…</div></div>
    </div>

    <div class="right-col">
      <div id="noOrderSelected" class="card empty-note">Select an order to see details and chat.</div>
      <div id="orderDetailBox" class="hidden right-col-inner">
        <div class="card">
          <div class="card-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>Order Details</div>
          <div class="order-detail" id="orderDetail"></div>
          <div class="order-actions" id="orderApproveRow"></div>
        </div>
        <div class="card chat-panel">
          <div class="card-title"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Chat</div>
          <div id="chatOrderStrip" class="chat-order-strip"></div>
          <div id="chatCustomerHeader"></div>
          <div id="chatMessages" class="chat-messages"></div>
          <form id="chatForm" class="chat-input-row">
            <input id="chatInput" type="text" placeholder="Reply to customer…" autocomplete="off" />
            <button type="submit"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Send</button>
          </form>
        </div>
      </div>
    </div>
  </div>
</div>

<div id="userDetailModal" class="modal-backdrop hidden">
  <div class="modal-card">
    <span class="modal-close" id="userDetailCloseBtn">&times;</span>
    <div id="userDetailContent"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// Must match the same project as index.html's SUPABASE_URL / SUPABASE_ANON_KEY.
const SUPABASE_URL = "https://sekntmukqliznwilsxox.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_vGOC2MkDEn9t4tFmuoHV0g_R06t-Jgb";
// A distinct storageKey keeps this admin login completely separate from a
// customer session in index.html -- without it, both pages share the same
// browser storage slot and whichever account logs in last "wins" on both.
const sb = (/^https?:\/\//.test(SUPABASE_URL))
  ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, { auth: { storageKey: "gph-admin-auth" } })
  : null;

const ICON_CHECK = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><polyline points="20 6 9 17 4 12"/></svg>`;
const ICON_X = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>`;
const ICON_IMAGE = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>`;
const ICON_USER = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`;
const ICON_ARCHIVE = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/></svg>`;
const ICON_RESTORE = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>`;

const loginView = document.getElementById("loginView");
const dashboardView = document.getElementById("dashboardView");
const loginError = document.getElementById("loginError");
const orderList = document.getElementById("orderList");
const noOrderSelected = document.getElementById("noOrderSelected");
const orderDetailBox = document.getElementById("orderDetailBox");
const orderDetail = document.getElementById("orderDetail");
const orderApproveRow = document.getElementById("orderApproveRow");
const chatMessages = document.getElementById("chatMessages");

let orders = [];
let showArchived = false;
let selectedOrderId = null;
let orderChannel = null; // per-order broadcast channel, for instant customer replies

function fail(msg){ loginError.textContent = msg; }

document.getElementById("loginBtn").addEventListener("click", async () => {
  if(!sb){ fail("Supabase ကို config မလုပ်ရသေးပါ — SUPABASE_URL/KEY ကို ဖြည့်ပါ။"); return; }
  fail("");
  const email = document.getElementById("loginEmail").value.trim();
  const password = document.getElementById("loginPassword").value;
  const { error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ fail(error.message); return; }
  await checkAdminAndEnter();
});

document.getElementById("signOutBtn").addEventListener("click", async () => {
  await sb.auth.signOut();
  location.reload();
});

async function checkAdminAndEnter(){
  const { data: isAdmin, error } = await sb.rpc("is_admin");
  if(error || !isAdmin){
    fail("ဒီ account က admin မဟုတ်ပါ။ Supabase's admins table ထဲ user_id ထည့်ပေးထားဖို့လိုပါတယ်။");
    await sb.auth.signOut();
    return;
  }
  loginView.classList.add("hidden");
  dashboardView.classList.remove("hidden");
  loadOrders();
  subscribeRealtime();
}

function statusBadge(status){
  return `<span class="badge ${status}">${status.toUpperCase()}</span>`;
}

function renderChatCustomerHeader(label){
  const el = document.getElementById("chatCustomerHeader");
  if(el) el.innerHTML = `<div class="chat-customer-header">${ICON_USER}Chatting with <b>${label}</b></div>`;
}

document.getElementById("loginPwToggle")?.addEventListener("click", () => {
  const input = document.getElementById("loginPassword");
  const btn = document.getElementById("loginPwToggle");
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  btn.innerHTML = show
    ? `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 20c-7 0-11-8-11-8a21.8 21.8 0 0 1 5.06-6.06M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a21.8 21.8 0 0 1-3.22 4.44M14.12 14.12a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`
    : `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>`;
  btn.setAttribute("aria-label", show ? "Hide password" : "Show password");
});

function friendlyDateLabel(dateStr){
  const d = new Date(dateStr);
  const dOnly = new Date(d); dOnly.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const yesterday = new Date(today); yesterday.setDate(today.getDate() - 1);
  if(dOnly.getTime() === today.getTime()) return "Today";
  if(dOnly.getTime() === yesterday.getTime()) return "Yesterday";
  return d.toLocaleDateString(undefined, { weekday: "short", year: "numeric", month: "short", day: "numeric" });
}

function renderOrderRow(o){
  return `
    <div class="order-row ${o.id === selectedOrderId ? "active" : ""}" data-id="${o.id}">
      <div class="code">${o.order_code} ${o.archived ? statusBadge("archived") : statusBadge(o.status)}</div>
      <div class="line">${o.product_name} · ${o.plan_name}</div>
      <div class="line">${Number(o.amount).toLocaleString()} Ks · ${o.payment_method || "-"}</div>
    </div>
  `;
}

function renderOrderList(){
  // Archived orders (old test orders, clutter an admin no longer needs to
  // see day-to-day) stay in the database -- they're just hidden from the
  // default list -- so "Show archived" can always bring them back.
  const visible = orders.filter(o => showArchived ? o.archived : !o.archived);
  if(!visible.length){
    orderList.innerHTML = `<div class='empty-note'>${showArchived ? "No archived orders." : "No orders yet."}</div>`;
    return;
  }
  // orders is already sorted newest-first, so grouping by day (in that
  // same order) naturally keeps the date headers newest-to-oldest too.
  const groups = [];
  let currentKey = null;
  visible.forEach(o => {
    const key = new Date(o.created_at).toDateString();
    if(key !== currentKey){ groups.push({ key, items: [] }); currentKey = key; }
    groups[groups.length - 1].items.push(o);
  });
  orderList.innerHTML = groups.map(g => `
    <div class="order-date-header">${friendlyDateLabel(g.items[0].created_at)}</div>
    ${g.items.map(renderOrderRow).join("")}
  `).join("");
  orderList.querySelectorAll(".order-row").forEach(el => {
    el.addEventListener("click", () => selectOrder(el.dataset.id));
  });
}

document.getElementById("toggleArchivedBtn")?.addEventListener("click", (e) => {
  showArchived = !showArchived;
  e.target.textContent = showArchived ? "Show active orders" : "Show archived";
  renderOrderList();
});

let userSearchResultsCache = [];

document.getElementById("userSearchInput")?.addEventListener("input", async (e) => {
  const box = document.getElementById("userSearchResults");
  const q = e.target.value.trim();
  if(!q){ box.innerHTML = ""; return; }
  const { data, error } = await sb.rpc("admin_search_users", { p_query: q });
  if(error){ box.innerHTML = `<div class="empty-note">${error.message}</div>`; return; }
  if(!data || !data.length){ box.innerHTML = `<div class="empty-note">No matching account.</div>`; return; }
  userSearchResultsCache = data;
  box.innerHTML = data.map(u => `<div class="user-search-row" data-id="${u.id}"><span>${u.email}</span><span class="line">Joined ${new Date(u.created_at).toLocaleDateString()}</span></div>`).join("");
  box.querySelectorAll(".user-search-row").forEach(el => {
    el.addEventListener("click", () => {
      const user = userSearchResultsCache.find(u => u.id === el.dataset.id);
      if(user) showUserDetail(user);
    });
  });
});

const userDetailModal = document.getElementById("userDetailModal");
const userDetailContent = document.getElementById("userDetailContent");
document.getElementById("userDetailCloseBtn")?.addEventListener("click", () => userDetailModal.classList.add("hidden"));
userDetailModal?.addEventListener("click", (e) => { if(e.target === userDetailModal) userDetailModal.classList.add("hidden"); });

async function showUserDetail(user){
  userDetailModal.classList.remove("hidden");
  userDetailContent.innerHTML = "<div class='empty-note'>Loading…</div>";
  const { data: userOrders, error } = await sb.from("orders")
    .select("*").eq("user_id", user.id).order("created_at", { ascending: false });
  if(error){ userDetailContent.innerHTML = `<div class="empty-note">${error.message}</div>`; return; }
  const list = userOrders || [];
  const spent = list
    .filter(o => o.status === "approved" || o.status === "completed")
    .reduce((sum, o) => sum + Number(o.amount || 0), 0);
  const rows = list.length
    ? list.map(o => `
        <div class="order-row" style="cursor:default;">
          <div class="code">${o.order_code} ${statusBadge(o.status)}</div>
          <div class="line">${o.product_name} · ${o.plan_name}</div>
          <div class="line">${Number(o.amount).toLocaleString()} Ks · ${new Date(o.created_at).toLocaleDateString()}</div>
        </div>
      `).join("")
    : `<div class="empty-note">No orders yet.</div>`;
  userDetailContent.innerHTML = `
    <div class="card-title">${ICON_USER}${user.email}</div>
    <table class="order-detail-table">
      <tr><th>Registered since</th><td>${new Date(user.created_at).toLocaleString()}</td></tr>
      <tr><th>Total orders</th><td>${list.length}</td></tr>
      <tr><th>Total amount spent</th><td><b>${spent.toLocaleString()} Ks</b></td></tr>
    </table>
    <div class="card-title" style="margin-top:4px;">Order history</div>
    <div class="user-orders-list">${rows}</div>
  `;
}

async function loadOrders(){
  const { data, error } = await sb.from("orders").select("*").order("created_at", { ascending: false });
  if(!error){ orders = data || []; renderOrderList(); }
}

function subscribeRealtime(){
  // New chat messages arrive via the per-order broadcast channel
  // subscribed in selectOrder() instead of postgres_changes here, so a
  // customer's reply never depends on Realtime replication being
  // enabled for the "messages" table (and never double-renders if it is).
  sb.channel("admin-orders")
    .on("postgres_changes", { event: "*", schema: "public", table: "orders" }, () => loadOrders())
    .subscribe();
}

async function selectOrder(id){
  selectedOrderId = id;
  renderOrderList();
  const order = orders.find(o => o.id === id);
  if(!order) return;

  // The customer's browser broadcasts new chat messages on this same
  // channel (see index.html) -- postgres_changes below is a useful
  // backup, but depends on Realtime replication being turned on for the
  // "messages" table, so it alone was showing customer replies late or
  // not at all. Subscribing here gets them instantly either way.
  if(orderChannel) sb.removeChannel(orderChannel);
  orderChannel = sb.channel("order-" + order.access_token);
  orderChannel
    .on("broadcast", { event: "new_message" }, (msg) => {
      if(msg.payload.sender === "customer" && selectedOrderId === order.id){
        appendBubble("customer", msg.payload.body);
      }
    })
    .subscribe();

  noOrderSelected.classList.add("hidden");
  orderDetailBox.classList.remove("hidden");
  orderDetail.innerHTML = `
    <table class="order-detail-table">
      <tr><th>Product</th><td>${order.product_name}</td></tr>
      <tr><th>Plan</th><td>${order.plan_name}</td></tr>
      <tr><th>Amount</th><td><b>${Number(order.amount).toLocaleString()} Ks</b></td></tr>
      <tr><th>Payment</th><td>${order.payment_method || "-"}</td></tr>
      <tr><th>Account/Email</th><td>${order.account_info || "-"}</td></tr>
      <tr><th>Note</th><td>${order.note || "-"}</td></tr>
      <tr><th>Placed</th><td>${new Date(order.created_at).toLocaleString()}</td></tr>
      <tr><th>Payment Slip</th><td id="slipStatus">${order.payment_slip_path ? "Loading…" : "None attached"}</td></tr>
    </table>
  `;
  document.getElementById("chatOrderStrip").innerHTML =
    `<span>${order.order_code}</span><b>${Number(order.amount).toLocaleString()} Ks</b>${statusBadge(order.archived ? "archived" : order.status)}`;
  renderChatCustomerHeader(order.user_id ? "Loading…" : (order.account_info || "this customer (guest)"));
  if(order.user_id){
    sb.rpc("admin_get_user_email", { p_user_id: order.user_id }).then(({ data, error }) => {
      if(selectedOrderId !== order.id) return; // admin clicked a different order meanwhile
      const label = (!error && data) ? "@" + data.split("@")[0] : (order.account_info || "this customer");
      renderChatCustomerHeader(label);
    });
  }
  if(order.payment_slip_path){
    sb.storage.from("payment-slips").createSignedUrl(order.payment_slip_path, 3600).then(({ data, error }) => {
      const el = document.getElementById("slipStatus");
      if(!el) return;
      if(error || !data){ el.textContent = "Could not load payment slip."; return; }
      el.innerHTML = `<a href="${data.signedUrl}" target="_blank" rel="noopener">${ICON_IMAGE} View payment slip</a>`;
    });
  }
  const archiveButton = order.archived
    ? `<button id="archiveToggleBtn" class="ghost">${ICON_RESTORE} Unarchive</button>`
    : `<button id="archiveToggleBtn" class="ghost">${ICON_ARCHIVE} Archive</button>`;
  orderApproveRow.innerHTML = (order.status === "pending"
    ? `<button id="approveBtn">${ICON_CHECK} Approve</button><button id="rejectBtn" class="danger">${ICON_X} Reject</button>`
    : `${statusBadge(order.status)}`) + archiveButton;
  document.getElementById("approveBtn")?.addEventListener("click", () => setStatus(order, "approved"));
  document.getElementById("rejectBtn")?.addEventListener("click", () => setStatus(order, "rejected"));
  document.getElementById("archiveToggleBtn")?.addEventListener("click", () => setArchived(order, !order.archived));
  loadMessages(order.id);
}

async function setStatus(order, status){
  const { error } = await sb.from("orders").update({ status, updated_at: new Date().toISOString() }).eq("id", order.id);
  if(error){ alert("Update failed: " + error.message); return; }
  order.status = status;
  sb.channel("order-" + order.access_token).send({ type: "broadcast", event: "status_update", payload: { status } });
  selectOrder(order.id);
}

async function setArchived(order, archived){
  // Archiving only hides an order from the default list -- the row itself
  // is never deleted, so nothing here can lose an order or its chat
  // history, unlike an actual DELETE.
  const { error } = await sb.from("orders").update({ archived }).eq("id", order.id);
  if(error){ alert("Update failed: " + error.message); return; }
  order.archived = archived;
  renderOrderList();
  selectOrder(order.id);
}

function appendBubble(sender, body){
  const empty = chatMessages.querySelector(".empty-note");
  if(empty) empty.remove();
  const b = document.createElement("div");
  b.className = "bubble " + (sender === "admin" ? "admin" : "customer");
  b.textContent = body;
  chatMessages.appendChild(b);
  chatMessages.scrollTop = chatMessages.scrollHeight;
}

async function loadMessages(orderId){
  chatMessages.innerHTML = "<div class='empty-note'>Loading…</div>";
  const { data, error } = await sb.from("messages").select("*").eq("order_id", orderId).order("created_at", { ascending: true });
  chatMessages.innerHTML = "";
  if(!error && data && data.length){
    data.forEach(m => appendBubble(m.sender, m.body));
  } else {
    chatMessages.innerHTML = "<div class='empty-note'>No messages yet.</div>";
  }
}

document.getElementById("chatForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  const order = orders.find(o => o.id === selectedOrderId);
  if(!text || !order) return;
  input.value = "";
  const { error } = await sb.from("messages").insert({ order_id: order.id, sender: "admin", body: text });
  if(error){ alert("Send failed: " + error.message); return; }
  appendBubble("admin", text);
  sb.channel("order-" + order.access_token).send({ type: "broadcast", event: "new_message", payload: { sender: "admin", body: text } });
});

// Stay signed in across refreshes.
(async () => {
  if(!sb) return;
  const { data: { session } } = await sb.auth.getSession();
  if(session) checkAdminAndEnter();
})();
</script>
</body>
